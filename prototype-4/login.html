<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Sign in — Campus Resolve</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="auth-page">
    <a class="skip-link" href="#main-content">Skip to content</a>
    <header class="auth-top">
      <a class="brand" href="index.html"
        ><span class="brand-mark"
          ><svg class="icon" width="15" height="15">
            <use href="icons.svg#i-check" /></svg></span
        >Campus Resolve</a
      ><a class="back-button" href="index.html"
        ><svg class="icon" width="18" height="18">
          <use href="icons.svg#i-arrow-left" />
        </svg>
        Back to home</a
      >
    </header>
    <main id="main-content" class="auth-main">
      <section class="auth-card reveal">
        <div class="auth-copy">
          <p class="eyebrow">Welcome back</p>
          <h1>Sign in to Campus Resolve.</h1>
          <p>Use your campus email to access your complaint workspace.</p>
        </div>
        <form data-validate data-redirect="dashboard.html" novalidate>
          <div class="form-alert" hidden role="alert"></div>
          <label class="field"
            ><span>Email address</span
            ><input
              name="email"
              type="email"
              placeholder="you@campus.edu"
              autocomplete="email"
              required /><small class="error"></small></label
          ><label class="field"
            ><span>Password</span
            ><span class="password-wrap"
              ><input
                id="login-password"
                name="password"
                type="password"
                autocomplete="current-password"
                required /><button
                type="button"
                class="password-toggle"
                data-password-toggle="login-password"
                aria-label="Show password"
              >
                <svg class="icon" width="18" height="18">
                  <use href="icons.svg#i-eye" />
                </svg></button></span
            ><small class="error"></small></label
          ><button class="button primary full" type="submit">
            Sign in
            <svg class="icon" width="18" height="18">
              <use href="icons.svg#i-arrow" />
            </svg>
          </button>
        </form>
        <p class="auth-switch">
          New to Campus Resolve? <a href="register.html">Create an account</a>
        </p>
        <p class="demo-note">
          For the admin workspace, sign in with an email containing “admin”.
        </p>
      </section>
    </main>
    <div
      class="toast-region"
      aria-live="polite"
      aria-label="Notifications"
    ></div>
    <script src="app.js" defer></script>
  </body>
</html>
