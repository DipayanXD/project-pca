<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Create account — Campus Resolve</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="auth-page">
    <a class="skip-link" href="#main-content">Skip to content</a>
    <header class="auth-top">
      <a class="brand" href="index.html"
        ><span class="brand-mark"
          ><svg class="icon" width="15" height="15">
            <use href="icons.svg#i-check" /></svg></span
        >Campus Resolve</a
      ><a class="back-button" href="index.html"
        ><svg class="icon" width="18" height="18">
          <use href="icons.svg#i-arrow-left" />
        </svg>
        Back to home</a
      >
    </header>
    <main id="main-content" class="auth-main">
      <section class="auth-card reveal">
        <div class="auth-copy">
          <p class="eyebrow">Create your account</p>
          <h1>A clearer way to be heard.</h1>
          <p>Your complaint journey starts with a simple account.</p>
        </div>
        <form data-validate data-redirect="dashboard.html" novalidate>
          <div class="form-alert" hidden role="alert"></div>
          <label class="field"
            ><span>Full name</span
            ><input
              name="name"
              type="text"
              placeholder="Enter your full name"
              autocomplete="name"
              required /><small class="error"></small></label
          ><label class="field"
            ><span>Email address</span
            ><input
              name="email"
              type="email"
              placeholder="name@campus.edu"
              autocomplete="email"
              required /><small class="error"></small></label
          ><label class="field"
            ><span>Department</span
            ><select name="department" required>
              <option value="" disabled selected>Select your department</option>
              <option value="Computer Application">Computer Application</option>
              <option value="Computer Science &amp; Engineering">Computer Science &amp; Engineering</option>
              <option value="Information Technology">Information Technology</option>
              <option value="Electrical Engineering">Electrical Engineering</option>
              <option value="Mechanical Engineering">Mechanical Engineering</option>
              <option value="Civil Engineering">Civil Engineering</option>
              <option value="Business Administration">Business Administration</option>
              <option value="Science &amp; Humanities">Science &amp; Humanities</option>
              <option value="Other">Other</option>
            </select><small class="error"></small></label
          ><label class="field"
            ><span>Password</span
            ><span class="password-wrap"
              ><input
                id="register-password"
                name="password"
                type="password"
                placeholder="Create a password (min. 8 characters)"
                autocomplete="new-password"
                required /><button
                type="button"
                class="password-toggle"
                data-password-toggle="register-password"
                aria-label="Show password"
              >
                <svg class="icon" width="18" height="18">
                  <use href="icons.svg#i-eye" />
                </svg></button></span
            ><small class="error"></small></label
          ><label class="field"
            ><span>Confirm password</span
            ><span class="password-wrap"
              ><input
                id="confirm-password"
                name="confirmPassword"
                type="password"
                placeholder="Re-enter your password"
                autocomplete="new-password"
                required /><button
                type="button"
                class="password-toggle"
                data-password-toggle="confirm-password"
                aria-label="Show confirm password"
              >
                <svg class="icon" width="18" height="18">
                  <use href="icons.svg#i-eye" />
                </svg></button></span
            ><small class="error"></small
          ></label>
          <div class="strength" id="password-strength-container" aria-live="polite">
            <span>Password strength <strong class="strength-label" id="strength-label"></strong></span>
            <div><i></i><i></i><i></i><i></i></div>
          </div>
          <button class="button primary full" type="submit">
            Create account
            <svg class="icon" width="18" height="18">
              <use href="icons.svg#i-arrow" />
            </svg>
          </button>
        </form>
        <p class="auth-switch">
          Already have an account? <a href="login.html">Sign in</a>
        </p>
      </section>
    </main>
    <div
      class="toast-region"
      aria-live="polite"
      aria-label="Notifications"
    ></div>
    <script src="app.js" defer></script>
  </body>
</html>
